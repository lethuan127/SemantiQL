# CI runs the same script a contributor runs locally, so the two cannot disagree (FR-6).
#
# It must complete on a pull request from a fork, which means: no repository secrets, and
# a read-only token. A pipeline that needs a secret fails on every external contribution,
# which is the trap that catches most first-time public repos. Anything needing
# credentials — publishing, integration tests against a real service — belongs in a
# separate workflow triggered on push to main, never here.
#
# The Postgres database below is not an exception to that. It has no credential to store: the
# password is a literal in `compose.yaml`, and the database is created for one job and thrown
# away with it. This file must never reference the secrets context at all — that is the property
# a fork PR depends on, and it is grep-checkable.
#
# It comes up through the repo's own `compose.yaml` rather than a GitHub service container, so
# the image, the port and the database name have **one definition** that CI and a contributor's
# laptop share. The previous service container duplicated all three, and keeping them in step
# was a manual step someone would eventually forget.
name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.11 is the declared floor, so it is tested rather than merely asserted. It also
          # runs with no DSN on purpose: that exercises the Postgres suite's *skip* path on
          # every CI run, so the promise that a clone works without a database is checked
          # continuously rather than only when someone breaks it.
          - python-version: "3.11"
            test-dsn: ""
          # Must match what `compose.yaml` publishes — port 55432, database semantiql_test.
          - python-version: "3.13"
            test-dsn: postgresql://postgres:postgres@127.0.0.1:55432/semantiql_test

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Pin Python ${{ matrix.python-version }}
        run: uv python pin ${{ matrix.python-version }}

      # Only on the leg that has a DSN. The other leg deliberately has no database, so that the
      # skip path stays exercised — starting one there would cost time and test nothing.
      # `--wait` blocks on compose.yaml's healthcheck, so the suite never races a database that
      # is still starting. No teardown step: the runner is ephemeral and goes away with the job.
      - name: Start Postgres
        if: matrix.test-dsn != ''
        run: docker compose up -d --wait

      - name: Verify
        run: ./scripts/verify.sh
        env:
          SEMANTIQL_TEST_DSN: ${{ matrix.test-dsn }}
