name: Feature request
description: Propose a change before writing it
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Worth checking `CONTRIBUTING.md`'s "Out of scope" first — a few things are
        permanently declined, and it is better to know now.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can't you do today? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like to happen
    validations:
      required: true

  - type: dropdown
    id: offering
    attributes:
      label: Are you offering to implement it?
      options:
        - "Asking, not offering"
        - "Yes, if the approach is agreed first"
    validations:
      required: true
