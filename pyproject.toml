[project]
name = "semantiql"
version = "0.0.2"
description = "A semantic layer that lets AI query your database accurately."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Thuan Le" }]
keywords = ["semantic-layer", "sql", "duckdb", "postgres", "llm", "mcp"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
]
dependencies = [
  "sqlglot>=30,<31",
  "duckdb>=1.0",
  # The `binary` extra ships prebuilt wheels, so no libpq build step stands between a clone
  # and a working install — which is what the ≤15-minute setup rule needs (spec 010).
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "pyyaml>=6",
]

[project.scripts]
semantiql = "semantiql.cli:main"

[project.urls]
Repository = "https://github.com/lethuan127/semantiql"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semantiql"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# .claude/ and .specify/ hold agent tooling, including a vendored copy of the OKF
# validator whose canonical source lives in another repo. Reformatting a derived copy
# would break the canonicality rule the constitution sets, so they are out of scope.
extend-exclude = [".claude", ".specify"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts"]
strict = true
# duckdb ships no stubs; treat its surface as untyped rather than weakening strict globally.
[[tool.mypy.overrides]]
module = ["duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The end-to-end suite builds a 60k-row TPC-H corpus and checks the engine against
# hand-written SQL (specs/008-e2e-suite/). It runs by default because it costs a fraction of
# a second at the default scale, and a suite that only runs when someone remembers rots.
# Iterating? `-m "not e2e"`. Soak run? `SEMANTIQL_E2E_SF=1`.
markers = [
  "e2e: end-to-end tests over a generated corpus",
  # The Postgres suite needs a database this repo cannot bundle. Absent one it skips with a
  # stated reason rather than failing, so a fresh clone still passes the gate (spec 010).
  "pg: tests that need a live Postgres, reached via SEMANTIQL_TEST_DSN",
]
